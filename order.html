<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Support clean URLs like /order/table/01 by resolving assets from the site root.
      (function () {
        var m = location.pathname.match(/^(.*?)\/order(\/|$)/);
        if (m) {
          var b = document.createElement('base');
          b.href = m[1] + '/';
          document.head.appendChild(b);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Order · Selagi Coffee</title>
    <meta name="description" content="Order from Selagi Coffee — dine-in table QR ordering and takeaway. No account needed." />
    <meta name="theme-color" content="#142a9c" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/customer.css" />
  </head>
  <body class="customer">
    <div id="app">
      <div class="c-boot"><div class="brandmark pop">S</div><div class="spinner" style="color: var(--primary)"></div></div>
    </div>
    <script type="module" src="js/customer/app.js"></script>
  </body>
</html>
